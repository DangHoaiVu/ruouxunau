spring:
  config:
    import: optional:file:.env[.properties],optional:file:ruou_backend/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/binh_dinh_wine?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:ruou_app}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoint:
    health:
      show-details: always

app:
  auth:
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads}

